interface:
  display_name: "独立开发者产品调研"
  short_description: "深入调研美国idea：多平台需求、多词趋势、分类竞品与3–5个方向"
  default_prompt: "使用 product-idea-research 调研我的想法，判断美国市场是否值得独立开发者进入，交付四章可视化报告、评分和建议。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "agent-skills"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "host-tools"
    agent-skills: "host-tools"
    generic: "neutral-source"
